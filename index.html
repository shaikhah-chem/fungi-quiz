<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقويم الختامي – مدخل إلى الفطريات</title>
<style>
:root{--cream:#F7F6F0;--peach:#F0A97E;--peachD:#E08E5E;--navy:#1F3A5F;--teal:#159C94;--tealL:#DCEFEC;--gold:#D9A23A;--goldL:#FBEEDB;--red:#C00000;--redL:#FBE3E3;--ink:#262626;--muted:#5F6B73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:"Sakkal Majalla","Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh;position:relative;overflow-x:hidden}
.deco-l{position:fixed;left:0;bottom:0;width:min(26vw,300px);pointer-events:none;opacity:.95}
.deco-r{position:fixed;right:0;bottom:0;width:min(16vw,190px);pointer-events:none;opacity:.95}
.spores{position:fixed;top:0;left:0;width:200px;height:170px;pointer-events:none;background:
 radial-gradient(circle at 20px 30px,#E8A57E88 6px,transparent 7px),radial-gradient(circle at 60px 18px,#7FC4BE88 4px,transparent 5px),
 radial-gradient(circle at 40px 70px,#7FC4BE66 7px,transparent 8px),radial-gradient(circle at 95px 45px,#E8A57E66 4px,transparent 5px),
 radial-gradient(circle at 15px 110px,#E8A57E55 5px,transparent 6px),radial-gradient(circle at 130px 20px,#7FC4BE55 5px,transparent 6px),
 radial-gradient(circle at 75px 100px,#E8A57E44 3px,transparent 4px)}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 140px;position:relative;z-index:1}
.pill{margin:6px auto 18px;max-width:640px;background:var(--peach);border-radius:22px;padding:12px 22px;text-align:center;color:#fff;font-weight:700;font-size:clamp(22px,3.4vw,34px);border:2px dashed #ffffffaa;outline:3px solid var(--peach)}
.sub{text-align:center;color:var(--teal);font-weight:700;font-size:clamp(17px,2.2vw,22px);margin:-6px 0 18px}
.card{background:#fff;border:2px solid var(--tealL);border-radius:22px;padding:clamp(16px,3vw,30px);box-shadow:0 6px 20px rgba(31,58,95,.08)}
.hidden{display:none!important}
.btn{font:inherit;border:0;border-radius:999px;padding:12px 30px;font-size:clamp(20px,2.4vw,26px);font-weight:700;cursor:pointer;background:var(--teal);color:#fff;box-shadow:0 4px 0 #0f7a73;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f7a73}
.btn.ghost{background:var(--goldL);color:var(--navy);box-shadow:0 4px 0 #e9cfa3}
.center{text-align:center}
.start h2{color:var(--navy);font-size:clamp(26px,3.6vw,38px);margin:0 0 8px}
.start p{font-size:clamp(19px,2.3vw,24px);color:var(--muted);margin:6px 0 18px;line-height:1.7}
.start input{font:inherit;font-size:22px;padding:10px 16px;border-radius:14px;border:2px solid var(--tealL);width:min(360px,90%);text-align:center;margin-bottom:18px}
.rules{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 20px}
.rules span{background:var(--tealL);color:var(--navy);border-radius:999px;padding:6px 16px;font-size:19px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dot{width:18px;height:18px;border-radius:50%;background:#e4e2d8;border:2px solid #fff;box-shadow:0 0 0 1px #d8d5c8}
.dot.cur{background:var(--gold)} .dot.ok{background:var(--teal)} .dot.no{background:var(--red)}
.score{background:var(--navy);color:#fff;border-radius:999px;padding:6px 18px;font-size:20px;font-weight:700}
.qnum{color:var(--teal);font-weight:700;font-size:22px}
.q{color:var(--navy);font-size:clamp(26px,3.4vw,36px);font-weight:700;line-height:1.5;margin:6px 0 20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:right;font-size:clamp(22px,2.6vw,28px);font-weight:700;color:var(--navy);background:#fff;border:3px solid var(--tealL);border-radius:18px;padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:68px;transition:background .15s,border-color .15s,transform .1s}
.opt:hover{border-color:var(--teal)}
.opt .l{flex:none;width:40px;height:40px;border-radius:50%;background:var(--goldL);color:var(--navy);display:grid;place-items:center;font-size:22px}
.opt.ok{background:#E3F5EE;border-color:var(--teal)} .opt.ok .l{background:var(--teal);color:#fff}
.opt.no{background:var(--redL);border-color:var(--red)} .opt.no .l{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:18px;border-radius:18px;padding:14px 18px;font-size:clamp(20px,2.4vw,25px);line-height:1.6;display:flex;gap:14px;align-items:flex-start}
.fb.ok{background:#E3F5EE;color:#0f6b65} .fb.no{background:var(--goldL);color:#7a4b10}
.fb b{display:block;font-size:1.1em}
.fb .ic{font-size:34px;line-height:1}
.next{margin-top:18px;text-align:left}
.res h2{color:var(--navy);font-size:clamp(28px,4vw,42px);margin:4px 0}
.big{font-size:clamp(60px,9vw,96px);font-weight:700;color:var(--teal);line-height:1.1}
.stars{font-size:46px;letter-spacing:6px;color:var(--gold);margin:6px 0}
.msg{font-size:clamp(21px,2.6vw,27px);color:var(--muted);margin:6px 0 18px}
.review{margin:18px 0 6px;text-align:right}
.review div{border-bottom:1px dashed #e4e2d8;padding:8px 4px;font-size:20px}
.review .t{color:var(--teal);font-weight:700} .review .f{color:var(--red);font-weight:700}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.credit{position:fixed;left:10px;bottom:6px;font-size:12px;color:var(--muted);z-index:2}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>

<canvas class="confetti" id="cf"></canvas>
<div class="wrap">
  <div class="pill">التقويم الختامي</div>
  <div class="sub">مدخل إلى الفطريات · أحياء</div>

  <section id="start" class="card center start pop">
    <h2>هل أنتِ مستعدة يا عالمة الفطريات؟</h2>
    <p>أجيبي عن 6 أسئلة، وبعد كل إجابة ستظهر لكِ التغذية الراجعة مباشرة.</p>
    <div class="rules"><span>6 أسئلة</span><span>تغذية راجعة فورية</span><span>نجمة لكل إجابتين صحيحتين</span></div>
    <input id="name" placeholder="اكتبي اسمكِ أو اسم مجموعتك (اختياري)" maxlength="40"><br>
    <button class="btn" id="go">ابدئي التقويم</button>
  </section>

  <section id="quiz" class="card hidden">
    <div class="top"><span class="qnum" id="qnum"></span><div class="dots" id="dots"></div><span class="score" id="score">النقاط: 0</span></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div id="fb" class="fb hidden"></div>
    <div class="next"><button class="btn hidden" id="nextBtn">التالي ←</button></div>
  </section>

  <section id="res" class="card center res hidden">
    <h2 id="resTitle"></h2>
    <div class="big" id="resScore"></div>
    <div class="stars" id="stars"></div>
    <div class="msg" id="resMsg"></div>
    <div class="row"><button class="btn" id="again">أعيدي المحاولة</button><button class="btn ghost" id="showRev">مراجعة الإجابات</button></div>
    <div class="review hidden" id="review"></div>
  </section>
</div>
<div class="credit">تنفيذ المعلمة: أ. شيخه المطيري</div>

<script>
const Q=[
 {q:'مخلوقات حية غير ذاتية التغذي، تحلّل الغذاء قبل امتصاصه:',o:['الفطريات','النباتات','الطحالب','الفيروسات'],a:0,e:'الفطريات تفرز إنزيمات تحلّل الغذاء خارج جسمها، ثم تمتصه.'},
 {q:'أي مما يأتي يُعدّ خاصية للفطريات؟',o:['تكوّن مستعمرات وحيدة الخلية','لها خلايا تحتوي على نواة','تصنع الغذاء بالبناء الضوئي','لها دورة حياة قصيرة جدًا'],a:1,e:'الفطريات حقيقية النوى؛ لخلاياها نواة محاطة بغشاء.'},
 {q:'جدران تقسم خلايا الفطر:',o:['الأبواغ','الحواجز','الغزل الفطري','الجسم الثمري'],a:1,e:'الحواجز تقسم الخيوط الفطرية إلى خلايا، وفيها ثقوب تسمح بمرور السيتوبلازم.'},
 {q:'المادة القوية المرنة التي يتكوّن منها الجدار الخلوي للفطريات:',o:['السيليلوز','الكايتين','السيليكا','النشا'],a:1,e:'الكايتين… وهو نفسه في الهيكل الخارجي للخنفساء!'},
 {q:'كتلة شبكية من الخيوط الفطرية تنمو تحت سطح التربة:',o:['الجسم الثمري','الغزل الفطري','الحواجز','الأبواغ'],a:1,e:'الغزل الفطري ينمو تحت التربة، أما الجسم الثمري فهو التركيب التكاثري فوقها.'},
 {q:'نسيت نورة مكوّنًا فلم ينتفخ عجين البيتزا. ما المكوّن الذي نسيته؟',o:['الملح','الزيت','الخميرة','الجبن'],a:2,e:'الخميرة فطر وحيد الخلية يحلّل السكر وينتج غاز CO₂ الذي ينفخ العجين.'}
];
const L=['أ','ب','ج','د'];
const $=id=>document.getElementById(id);
let i=0,score=0,res=[];
let AC=null;function tone(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 const notes=ok?[523,659,784]:[311,247];notes.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t+k*0.12);g.gain.exponentialRampToValueAtTime(ok?0.25:0.12,t+k*0.12+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+k*0.12+0.22);
 o.connect(g).connect(AC.destination);o.start(t+k*0.12);o.stop(t+k*0.12+0.25);});}catch(e){}}
function show(id){['start','quiz','res'].forEach(s=>$(s).classList.toggle('hidden',s!==id));$(id).classList.remove('pop');void $(id).offsetWidth;$(id).classList.add('pop');}
function dots(){$('dots').innerHTML=Q.map((_,k)=>`<span class="dot ${k<res.length?(res[k]?'ok':'no'):(k===i?'cur':'')}"></span>`).join('');}
function render(){const it=Q[i];$('qnum').textContent='السؤال '+(i+1)+' من '+Q.length;$('score').textContent='النقاط: '+score;$('q').textContent=it.q;
 $('opts').innerHTML='';it.o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="l">${L[k]}</span><span>${t}</span>`;b.onclick=()=>pick(k,b);$('opts').appendChild(b);});
 $('fb').className='fb hidden';$('nextBtn').classList.add('hidden');dots();}
function pick(k,b){const it=Q[i],ok=k===it.a;res.push(ok);if(ok)score++;tone(ok);
 [...$('opts').children].forEach((x,n)=>{x.disabled=true;if(n===it.a)x.classList.add('ok');});
 if(!ok){b.classList.add('no');b.classList.add('shake');}
 $('fb').className='fb '+(ok?'ok':'no');$('fb').innerHTML=`<span class="ic">${ok?'✔':'💡'}</span><div><b>${ok?'أحسنتِ! إجابة صحيحة':'ليست هذه… الإجابة الصحيحة: '+it.o[it.a]}</b>${it.e}</div>`;
 $('score').textContent='النقاط: '+score;dots();$('nextBtn').textContent=i<Q.length-1?'التالي ←':'النتيجة ←';$('nextBtn').classList.remove('hidden');}
function finish(){show('res');const n=$('name').value.trim();$('resTitle').textContent=n?('أحسنتِ يا '+n+'!'):'انتهى التقويم!';
 $('resScore').textContent=score+' من '+Q.length;const st=Math.round(score/2);$('stars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
 $('resMsg').textContent=score===Q.length?'ممتاز! أتقنتِ خصائص الفطريات وتركيبها.':score>=4?'رائع! راجعي الأسئلة التي أخطأتِ فيها.':'لا بأس… راجعي الدرس وحاولي مرة أخرى.';
 $('review').innerHTML=Q.map((q,k)=>`<div>${k+1}. ${q.q} <span class="${res[k]?'t':'f'}">${res[k]?'✔':'✘'} ${q.o[q.a]}</span></div>`).join('');
 $('review').classList.add('hidden');if(score>=4)confetti();}
$('go').onclick=()=>{i=0;score=0;res=[];show('quiz');render();};
$('nextBtn').onclick=()=>{if(i<Q.length-1){i++;render();}else finish();};
$('again').onclick=()=>{i=0;score=0;res=[];show('quiz');render();};
$('showRev').onclick=()=>$('review').classList.toggle('hidden');
document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden'))return;const m={'1':0,'2':1,'3':2,'4':3}[e.key];if(m!==undefined&&$('nextBtn').classList.contains('hidden')){$('opts').children[m].click();}
 if((e.key==='Enter'||e.key===' ')&&!$('nextBtn').classList.contains('hidden')){e.preventDefault();$('nextBtn').click();}});
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#F0A97E','#159C94','#D9A23A','#1F3A5F','#7FC4BE'];
 const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,v:2+Math.random()*3,a:Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
 let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.08;x.fillStyle=p.c;x.beginPath();x.ellipse(p.x+Math.sin(p.a)*10,p.y,p.r,p.r*.6,p.a,0,7);x.fill();});if(++f<220)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height);})();}
</script>
